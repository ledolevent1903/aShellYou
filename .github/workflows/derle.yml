name: aShellYou APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari ve Alt Modulleri Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Calistirma Yetkisi Ver
        run: chmod +x gradlew

      - name: Sadece Ana APKyi Derle
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: APK Yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aShellYou-WifiButonlu
          path: app/build/outputs/apk/debug/*.apk
