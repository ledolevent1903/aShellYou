name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Calistirma Yetkisi Ver
        run: chmod +x gradlew

      - name: Optimize ARM64 APK Derle
        run: ./gradlew assembleGithubDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon

      - name: APKyi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: aShellYou-WifiButonlu-KucukBoyut
          path: app/build/outputs/apk/**/*.apk
