name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Calistirma Yetkisi Ver
        run: chmod +x gradlew

      - name: Imza Anahtari (Keystore) Olustur
        run: |
          keytool -genkey -v -keystore release.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android, OU=Android, O=Android, L=US, S=CA, C=US"

      - name: Release APK Derle
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: android
          KEY_PASSWORD: android
          STORE_FILE: release.keystore
          STORE_PASSWORD: android
          RELEASE_KEYSTORE: release.keystore
          RELEASE_KEYSTORE_PASSWORD: android
          RELEASE_KEY_ALIAS: android
          RELEASE_KEY_PASSWORD: android
        run: |
          ./gradlew assembleGithubRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon

      - name: Sadece Chery Omoda 5 Icin Tek ARM64 APKyi Ayikla
        run: |
          mkdir -p final_apk
          # Klasör içindeki mimarileri listele ve arm64 olan tek APK'yı taşı
          ARM64_FILE=$(find app/build/outputs/apk/github/release -name "*arm64*.apk" | head -n 1)
          if [ -n "$ARM64_FILE" ]; then
            cp "$ARM64_FILE" final_apk/aShellYou-Chery-arm64.apk
          else
            # Eğer mimari bölünmediyse üretilen tek release APK'sını al
            REL_FILE=$(find app/build/outputs/apk/github/release -name "*.apk" | head -n 1)
            cp "$REL_FILE" final_apk/aShellYou-Chery-arm64.apk
          fi
          ls -lh final_apk/

      - name: Sadece 10 MB Tek APKyi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: aShellYou-Chery-Tek-APK
          path: final_apk/aShellYou-Chery-arm64.apk
