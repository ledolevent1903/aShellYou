name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Calistirma Yetkisi Ver
        run: chmod +x gradlew

      - name: Sadece Chery Icin ARM64 Debug APK Derle
        run: |
          ./gradlew :app:assembleGithubDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon

      - name: Tek APKyi Ayikla
        run: |
          mkdir -p cikti
          # Uretilen tum apk'lari tara ve sadece github/debug altindaki arm64 paketini al
          HEDEF_APK=$(find app/build/outputs/apk/github/debug -name "*.apk" | head -n 1)
          if [ -z "$HEDEF_APK" ]; then
            HEDEF_APK=$(find app/build/outputs/apk -name "*debug.apk" | grep -v "fdroid" | head -n 1)
          fi
          echo "Bulunan APK: $HEDEF_APK"
          cp "$HEDEF_APK" cikti/aShellYou-Chery-Omoda5.apk
          ls -lh cikti/

      - name: Kucuk Boyutlu APKyi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: aShellYou-Chery-Omoda5
          path: cikti/aShellYou-Chery-Omoda5.apk
