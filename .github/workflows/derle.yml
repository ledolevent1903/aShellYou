name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Calistirma Yetkisi Ver
        run: chmod +x gradlew

      - name: Gecerli Bir Release Keystore Uret
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/release.keystore \
            -alias androidreleasekey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Chery, OU=Automotive, O=Omoda, L=TR, S=TR, C=TR"

      - name: Release APK Derle (R8 Optimizasyonlu)
        env:
          KEYSTORE_PATH: /home/runner/.android/release.keystore
          KEYSTORE_FILE: /home/runner/.android/release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androidreleasekey
          KEY_PASSWORD: android
          RELEASE_STORE_FILE: /home/runner/.android/release.keystore
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androidreleasekey
          RELEASE_KEY_PASSWORD: android
        run: |
          ./gradlew :app:assembleGithubRelease \
            -Pandroid.injected.signing.store.file=/home/runner/.android/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androidreleasekey \
            -Pandroid.injected.signing.key.password=android \
            -x lint -x lintAnalyzeRelease -x lintVitalAnalyzeRelease \
            --no-daemon

      - name: Universal Olanlari Ele ve Sadece ARM64 Sec
        run: |
          mkdir -p cikti
          echo "=== Tum Uretilen APK Dosyalari ve Boyutlari ==="
          ls -lh $(find . -name "*.apk" -type f)
          
          # Oncelikle isminde acikca 'arm64' gecen release dosyasini ara
          ARM64_APK=$(find . -name "*arm64*.apk" -type f | grep -v "universal" | head -n 1)
          
          # Eger ozel isimlendirilmemisse boyutu en kucuk olan release apk'sini sec (95 MB olan universal elensin)
          if [ -z "$ARM64_APK" ]; then
            ARM64_APK=$(find . -name "*release*.apk" -type f | grep -v "universal" | head -n 1)
          fi
          
          echo ">>> Secilen Kucuk Boyutlu APK: $ARM64_APK"
          cp "$ARM64_APK" cikti/aShellYou-Chery-Omoda5-11MB.apk
          
          echo "=== Yuklenecek Nihai Dosya ==="
          ls -lh cikti/aShellYou-Chery-Omoda5-11MB.apk

      - name: 11 MB APKyi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: aShellYou-Chery-11MB
          path: cikti/aShellYou-Chery-Omoda5-11MB.apk
