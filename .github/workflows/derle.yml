name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Calistirma Yetkisi Ver
        run: chmod +x gradlew

      - name: Imzalamayi Devre Disi Birak (Imza Hatasini Onler)
        run: |
          # build.gradle.kts icindeki zorunlu release imza kuralini gecici olarak kaldir
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' app/build.gradle.kts || true

      - name: Optimize Release APK Derle (R8 Kod Kucultme Acik)
        run: |
          ./gradlew :app:assembleGithubRelease -Pandroid.injected.build.abi=arm64-v8a --no-daemon

      - name: Android Imzalama Aracini Kur
        run: sudo apt-get install -y apksigner

      - name: APKyi Imzala ve Ayikla
        run: |
          mkdir -p cikti
          # Olusan imzasiz release APK'sini bul
          HAM_APK=$(find . -name "*github*release*.apk" -type f | head -n 1)
          if [ -z "$HAM_APK" ]; then
            HAM_APK=$(find . -name "*release*.apk" -type f | head -n 1)
          fi
          
          echo "Bulunan Ham Release APK: $HAM_APK"
          
          # Hizlica test anahtari olustur ve APK'yi imzala
          keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Chery, OU=App, O=Auto, L=TR, S=TR, C=TR"
          apksigner sign --ks test.keystore --ks-pass pass:123456 --key-pass pass:123456 --out cikti/aShellYou-Chery-10MB.apk "$HAM_APK"
          
          echo "=== Nihai APK Boyutu ==="
          ls -lh cikti/aShellYou-Chery-10MB.apk

      - name: 10 MB APKyi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: aShellYou-Chery-Omoda5-10MB
          path: cikti/aShellYou-Chery-10MB.apk
