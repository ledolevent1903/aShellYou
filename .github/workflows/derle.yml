name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Calistirma Yetkisi Ver
        run: chmod +x gradlew

      - name: Gecerli Bir Release Keystore Uret
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/release.keystore \
            -alias androidreleasekey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Chery, OU=Automotive, O=Omoda, L=TR, S=TR, C=TR"

      - name: Release APK Derle (R8 Optimizasyonlu)
        env:
          KEYSTORE_PATH: /home/runner/.android/release.keystore
          KEYSTORE_FILE: /home/runner/.android/release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androidreleasekey
          KEY_PASSWORD: android
          RELEASE_STORE_FILE: /home/runner/.android/release.keystore
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androidreleasekey
          RELEASE_KEY_PASSWORD: android
        run: |
          ./gradlew :app:assembleGithubRelease \
            -Pandroid.injected.signing.store.file=/home/runner/.android/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androidreleasekey \
            -Pandroid.injected.signing.key.password=android \
            -Pandroid.injected.build.abi=arm64-v8a \
            -x lint -x lintAnalyzeRelease -x lintVitalAnalyzeRelease \
            --no-daemon

      - name: Sadece 10 MB ARM64 Release APKyi Ayikla
        run: |
          mkdir -p cikti
          echo "=== Tum Uretilen APKlar ==="
          find . -name "*.apk" -type f
          
          # github release klasorundeki arm64 veya genel release apk'sini sec
          HEDEF_APK=$(find . -path "*github*release*" -name "*.apk" -type f | head -n 1)
          if [ -z "$HEDEF_APK" ]; then
            HEDEF_APK=$(find . -name "*release*.apk" -type f | head -n 1)
          fi
          
          echo "Secilen Hedef APK: $HEDEF_APK"
          cp "$HEDEF_APK" cikti/aShellYou-Chery-Omoda5-10MB.apk
          
          echo "=== Nihai Dosya Boyutu ==="
          ls -lh cikti/aShellYou-Chery-Omoda5-10MB.apk

      - name: 10 MB APKyi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: aShellYou-Chery-10MB
          path: cikti/aShellYou-Chery-Omoda5-10MB.apk
