name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Calistirma Yetkisi Ver
        run: chmod +x gradlew

      - name: Sadece Chery Icin ARM64 Debug APK Derle
        run: |
          ./gradlew :app:assembleGithubDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon

      - name: Uretilen APKyi Bul ve Tasi
        run: |
          mkdir -p cikti
          # Projenin tamaminda olusan tum apk dosyalarini listele
          echo "=== Uretilen Tum APK Dosyalari ==="
          find . -name "*.apk" -type f
          
          # github-debug veya debug apk dosyasini sec (fdroid haric)
          APK_DOSYASI=$(find . -name "*github*debug*.apk" -type f | head -n 1)
          if [ -z "$APK_DOSYASI" ]; then
            APK_DOSYASI=$(find . -name "*debug.apk" -type f | grep -v "fdroid" | head -n 1)
          fi
          
          echo "Secilen APK: $APK_DOSYASI"
          cp "$APK_DOSYASI" cikti/aShellYou-Chery-Omoda5.apk
          
          echo "=== Cikti Dosyasi Boyutu ==="
          ls -lh cikti/aShellYou-Chery-Omoda5.apk

      - name: Kucuk Boyutlu APKyi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: aShellYou-Chery-Omoda5
          path: cikti/aShellYou-Chery-Omoda5.apk
